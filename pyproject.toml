[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vek"
version = "0.2.1"
description = "Content-addressed execution store for AI agents — git semantics for agent tool calls."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "AVIDS2" },
]
keywords = ["agent", "git", "content-addressed", "execution-history", "DAG", "tool-call"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vek = "vek.cli:main"

[project.urls]
Repository = "https://github.com/AVIDS2/vek"

[tool.hatch.build.targets.wheel]
packages = ["src/vek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
